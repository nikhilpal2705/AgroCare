# support reading from .env file
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

# Server configuration
server.port = ${SERVER_PORT:${PORT:8080}}
spring.jpa.hibernate.naming.physical-strategy=com.agrocare.agrocare.configuration.other.CamelCasePhysicalNamingStrategy

# Database configuration
spring.datasource.name = ${DATABASE_NAME:agrocare}
spring.datasource.url = ${DATABASE_URL:jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:agrocare}?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.datasource.username = ${DATABASE_USERNAME:root}
spring.datasource.password = ${DATABASE_PASSWORD:}


# Hibernate properties
spring.jpa.show-sql = ${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.use_sql_comments = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.hibernate.ddl-auto = ${HIBERNATE_DDL:update}
