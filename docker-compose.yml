services:
  mysql:
    image: mysql:8.3.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD} # Set the root password only
    ports:
      - "3307:3306" # Expose MySQL on port 3306
    volumes:
      - mysql:/var/lib/mysql # Persist MySQL data
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:${PORT}" # Frontend
      - "${SERVER_PORT}:${SERVER_PORT}" # Backend
    depends_on:
      - mysql
    environment:
      # Client
      PORT: ${PORT}
      # Server
      CLIENT_BASE_URL: ${CLIENT_BASE_URL}
      SERVER_PORT: ${SERVER_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: mysql
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      SHOW_SQL: ${SHOW_SQL}
      HIBERNATE_DDL: ${HIBERNATE_DDL}
      JWT_SECRET: ${JWT_SECRET}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_AUTO_COMMIT: ${DB_POOL_AUTO_COMMIT:-true}
    env_file:
      - ./.env
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql: # Declaring the volume to persist data
